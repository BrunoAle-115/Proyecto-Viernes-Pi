; ==============================================================================
; V.I.E.R.N.E.S. - Asterisk Dialplan (Chilean Telephony & AI Stasis Application)
; Regulaciones SUBTEL Chile: Formato 9 dígitos para fijos y móviles
; Emergencias Nacionales: 131 (SAMU), 132 (Bomberos), 133 (Carabineros)
; ==============================================================================

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
; Troncal primaria y de respaldo predeterminada
PRIMARY_TRUNK=zadarma_endpoint
BACKUP_TRUNK_1=redvoiss_endpoint
BACKUP_TRUNK_2=twilio_endpoint
BACKUP_TRUNK_3=net2phone_endpoint

; AudioSocket Server endpoint para streaming AI
AUDIOSOCKET_HOST=127.0.0.1
AUDIOSOCKET_PORT=9099

; ==============================================================================
; MACRO / SUBRUTINA: NORMALIZACIÓN DE CALLERID CHILE (E.164 SUBTEL)
; Convierte números recibidos (+569XXXXXXXX, 9XXXXXXXX, 22XXXXXXX, etc.)
; ==============================================================================
[sub-normalize-chile-cid]
exten => s,1,NoOp(--- Normalizando CallerID: ${CALLERID(num)} ---)
same => n,Set(RAW_CID=${CALLERID(num)})
; Si viene con prefijo internacional +56
same => n,ExecIf($["${RAW_CID:0:3}" = "+56"]?Set(RAW_CID=${RAW_CID:3}))
; Si viene con prefijo 56
same => n,ExecIf($["${RAW_CID:0:2}" = "56"]?Set(RAW_CID=${RAW_CID:2}))
; Si viene con prefijo 0 o 09 antiguo
same => n,ExecIf($["${RAW_CID:0:1}" = "0"]?Set(RAW_CID=${RAW_CID:1}))
; Establecer CallerID normalizado a 9 dígitos y formato E.164 internacional
same => n,Set(CALLERID(num)=${RAW_CID})
same => n,Set(CALLERID(ANI)=+56${RAW_CID})
same => n,NoOp(--- CallerID Normalizado: ${CALLERID(num)} (+56${CALLERID(num)}) ---)
same => n,Return()

; ==============================================================================
; CONTEXTO ENTRANTE DESDE TRONCALES SIP CHILE (FROM PSTN)
; ==============================================================================
[from-pstn-chile]
; Captura cualquier DID entrante
exten => _X.,1,NoOp(=== LLAMADA ENTRANTE PSTN CHILE DID: ${EXTEN} DESDE: ${CALLERID(num)} ===)
same => n,Gosub(sub-normalize-chile-cid,s,1)
same => n,Answer(500)
same => n,Set(CHANNEL(language)=es_CL)
same => n,Set(CHANNEL(hangup_handler_push)=sub-hangup-handler,s,1)

; Opción 1: Enviar al Core de Inteligencia Artificial V.I.E.R.N.E.S vía ARI (Stasis)
same => n,NoOp(--- Enviando canal a Stasis App: viernes-voice ---)
same => n,Stasis(viernes-voice,inbound,${EXTEN},${CALLERID(num)})

; Fallback si la aplicación Stasis de V.I.E.R.N.E.S no responde o finaliza
same => n,NoOp(--- Stasis finalizado o no disponible. Ejecutando contingencia PSTN ---)
same => n,Playback(beeperr)
same => n,Hangup(16)

; Manejo de números especiales o pruebas
exten => s,1,NoOp(=== LLAMADA SIN DID ESPECÍFICO ===)
same => n,Gosub(sub-normalize-chile-cid,s,1)
same => n,Answer(500)
same => n,Stasis(viernes-voice,inbound,unknown,${CALLERID(num)})
same => n,Hangup()

; ==============================================================================
; CONTEXTO PARA AUDIOSOCKET DIRECTO (STREAMING RAW AUDIO CON LA IA)
; ==============================================================================
[audiosocket-stream]
exten => _X.,1,NoOp(=== INICIANDO STREAMING BIDIRECCIONAL AUDIOSOCKET V.I.E.R.N.E.S ===)
same => n,Answer()
; Genera UUID único para sesión de audio
same => n,Set(SESSION_UUID=${SHELL(uuidgen | tr -d '\n')})
same => n,AudioSocket(${SESSION_UUID},${AUDIOSOCKET_HOST}:${AUDIOSOCKET_PORT})
same => n,Hangup()

; ==============================================================================
; CONTEXTO DE SALIDA (OUTBOUND CHILE): ALERTAS Y LLAMADAS AUTOMATIZADAS
; Reglas de marcación Chile (SUBTEL):
; Móviles: 9XXXXXXXX (9 dígitos)
; Fijos Santiago: 22XXXXXXX / 23XXXXXXX (9 dígitos)
; Fijos Regiones: 32XXXXXXX (Valparaíso), 41XXXXXXX (Biobío), etc.
; ==============================================================================
[outbound-chile]
; Marcación a Móviles o Fijos de Chile (9 dígitos exactamente)
exten => _9XXXXXXXX,1,NoOp(=== LLAMADA SALIENTE V.I.E.R.N.E.S A CHILE: ${EXTEN} ===)
same => n,Set(TARGET_NUM=${EXTEN})
same => n,Gosub(sub-dial-outbound,s,1(${TARGET_NUM}))
same => n,Hangup()

exten => _22XXXXXXX,1,NoOp(=== LLAMADA SALIENTE FIJO SANTIAGO: ${EXTEN} ===)
same => n,Set(TARGET_NUM=${EXTEN})
same => n,Gosub(sub-dial-outbound,s,1(${TARGET_NUM}))
same => n,Hangup()

exten => _[2-8]XXXXXXXX,1,NoOp(=== LLAMADA SALIENTE RED FIJA/REGIONES: ${EXTEN} ===)
same => n,Set(TARGET_NUM=${EXTEN})
same => n,Gosub(sub-dial-outbound,s,1(${TARGET_NUM}))
same => n,Hangup()

; Marcación E.164 completa (+569XXXXXXXX o 569XXXXXXXX)
exten => _+569XXXXXXXX,1,NoOp(=== MARCACIÓN E.164 +56: ${EXTEN} ===)
same => n,Set(TARGET_NUM=${EXTEN:3})
same => n,Gosub(sub-dial-outbound,s,1(${TARGET_NUM}))
same => n,Hangup()

exten => _569XXXXXXXX,1,NoOp(=== MARCACIÓN 56: ${EXTEN} ===)
same => n,Set(TARGET_NUM=${EXTEN:2})
same => n,Gosub(sub-dial-outbound,s,1(${TARGET_NUM}))
same => n,Hangup()

; Números de Emergencia Nacionales en Chile
exten => 131,1,NoOp(=== LLAMADA DE EMERGENCIA SAMU CHILE (131) ===)
same => n,Gosub(sub-dial-emergency,s,1(131))
same => n,Hangup()

exten => 132,1,NoOp(=== LLAMADA DE EMERGENCIA BOMBEROS CHILE (132) ===)
same => n,Gosub(sub-dial-emergency,s,1(132))
same => n,Hangup()

exten => 133,1,NoOp(=== LLAMADA DE EMERGENCIA CARABINEROS DE CHILE (133) ===)
same => n,Gosub(sub-dial-emergency,s,1(133))
same => n,Hangup()

; ==============================================================================
; SUBRUTINA: MARCACIÓN CON FAILOVER MULTI-CARRIER PARA CHILE
; ==============================================================================
[sub-dial-outbound]
exten => s,1,NoOp(--- Intentando llamada con Troncal Primaria: ${GLOBAL(PRIMARY_TRUNK)} ---)
same => n,Set(DEST=${ARG1})
same => n,Set(CALLERID(num)=${ENV(ZADARMA_DID_CL)})
same => n,Dial(PJSIP/+56${DEST}@${GLOBAL(PRIMARY_TRUNK)},45,gU(sub-call-connected))

; Failover 1: Redvoiss
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,NoOp(--- Falló troncal primaria (${DIALSTATUS}). Intentando Respaldo 1: Redvoiss ---)
same => n,Set(CALLERID(num)=${ENV(REDVOISS_DID_CL)})
same => n,Dial(PJSIP/${DEST}@${GLOBAL(BACKUP_TRUNK_1)},45,gU(sub-call-connected))

; Failover 2: Twilio CL
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,NoOp(--- Falló respaldo 1 (${DIALSTATUS}). Intentando Respaldo 2: Twilio CL ---)
same => n,Set(CALLERID(num)=${ENV(TWILIO_DID_CL)})
same => n,Dial(PJSIP/+56${DEST}@${GLOBAL(BACKUP_TRUNK_2)},45,gU(sub-call-connected))

; Failover 3: Net2Phone
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,NoOp(--- Falló respaldo 2 (${DIALSTATUS}). Intentando Respaldo 3: Net2Phone ---)
same => n,Set(CALLERID(num)=${ENV(NET2PHONE_DID_CL)})
same => n,Dial(PJSIP/${DEST}@${GLOBAL(BACKUP_TRUNK_3)},45,gU(sub-call-connected))

same => n(done),NoOp(--- Llamada concluida con estado: ${DIALSTATUS} ---)
same => n,Return()

; ==============================================================================
; SUBRUTINA: MARCACIÓN DE EMERGENCIAS
; ==============================================================================
[sub-dial-emergency]
exten => s,1,NoOp(--- MARCANDO SERVICIO DE EMERGENCIA CRÍTICO: ${ARG1} ---)
same => n,Set(EMERGENCY_NUM=${ARG1})
same => n,Dial(PJSIP/${EMERGENCY_NUM}@${GLOBAL(PRIMARY_TRUNK)},60)
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?end)
same => n,Dial(PJSIP/${EMERGENCY_NUM}@${GLOBAL(BACKUP_TRUNK_1)},60)
same => n(end),Return()

; ==============================================================================
; SUBRUTINA: EVENTO DE CONEXIÓN DE LLAMADA SALIENTE
; ==============================================================================
[sub-call-connected]
exten => s,1,NoOp(--- Llamada contestada por el abonado remoto ---)
same => n,Return()

; ==============================================================================
; SUBRUTINA: HANGUP HANDLER PARA TELEMETRÍA Y LOGGING
; ==============================================================================
[sub-hangup-handler]
exten => s,1,NoOp(=== REPORTE CDR / HANGUP: Duración=${CDR(duration)}s, Causa=${HANGUPCAUSE} ===)
same => n,Return()

; ==============================================================================
; CONTEXTO INTERNO Y OPERADORES
; ==============================================================================
[internal-viernes]
; Marcar a extensión interna
exten => 1001,1,Dial(PJSIP/1001,30)
same => n,Hangup()

exten => webrtc,1,Dial(PJSIP/webrtc_operator,30)
same => n,Hangup()

; Acceso directo a V.I.E.R.N.E.S AI por marcación interna (marcando *77)
exten => *77,1,NoOp(=== CONEXIÓN DIRECTA A V.I.E.R.N.E.S AI ===)
same => n,Answer()
same => n,Stasis(viernes-voice,internal,*77,${CALLERID(num)})
same => n,Hangup()

; Acceso al contexto de salida PSTN
include => outbound-chile
