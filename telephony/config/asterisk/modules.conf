; ==============================================================================
; V.I.E.R.N.E.S. - Asterisk Modules Configuration
; ==============================================================================

[modules]
autoload=yes

; Preload PJSIP core
preload => res_pjsip.so
preload => res_pjsip_session.so

; Módulos requeridos para ARI y Stasis
load => res_ari.so
load => res_ari_channels.so
load => res_ari_bridges.so
load => res_ari_recordings.so
load => res_ari_playbacks.so
load => res_ari_sounds.so
load => res_ari_events.so
load => res_stasis.so
load => res_stasis_playback.so
load => res_stasis_recording.so
load => app_stasis.so

; Streaming de Audio bidireccional
load => res_audiosocket.so
load => app_audiosocket.so
load => res_http_websocket.so

; Codecs
load => codec_alaw.so
load => codec_ulaw.so
load => codec_opus.so
load => codec_g722.so
load => codec_resample.so

; Deshabilitar módulos obsoletos de chan_sip
noload => chan_sip.so
noload => pbx_dundi.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
