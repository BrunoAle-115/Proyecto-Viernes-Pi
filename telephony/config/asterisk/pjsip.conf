; ==============================================================================
; V.I.E.R.N.E.S. - Asterisk PJSIP Configuration (Chile Multi-Carrier Architecture)
; Supported SIP Trunks: Zadarma Chile, Redvoiss, Twilio CL, Net2Phone
; Codecs: alaw (G.711a prioritario Chile), ulaw, opus (HD Voice), g729
; ==============================================================================

; ------------------------------------------------------------------------------
; GLOBAL CONFIGURATION
; ------------------------------------------------------------------------------
[global]
type=global
user_agent=VIERNES-AI-Telephony-CL/2.0
endpoint_identifier_order=ip,username,anonymous

; ------------------------------------------------------------------------------
; SYSTEM TRANSPORT CONFIGURATIONS
; ------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=${ENV(PUBLIC_IP)}
external_signaling_address=${ENV(PUBLIC_IP)}

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=${ENV(PUBLIC_IP)}
external_signaling_address=${ENV(PUBLIC_IP)}

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

; ==============================================================================
; TEMPLATES BASE
; ==============================================================================
[endpoint-template](!)
type=endpoint
context=from-pstn-chile
allow=!all,alaw,ulaw,opus,g729
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
timers=yes
timers_min_se=90
dtmf_mode=rfc4733
language=es_CL

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
qualify_frequency=30

; ==============================================================================
; 1. TRONCAL SIP: ZADARMA CHILE (Santiago / Valparaíso / Concepción / Móviles)
; ==============================================================================
[zadarma_reg]
type=registration
outbound_auth=zadarma_auth
server_uri=sip:sip.zadarma.com:5060
client_uri=sip:${ENV(ZADARMA_SIP_ID)}@sip.zadarma.com:5060
retry_interval=20
expiration=300
transport=transport-udp

[zadarma_auth](auth-template)
username=${ENV(ZADARMA_SIP_ID)}
password=${ENV(ZADARMA_SIP_PASSWORD)}

[zadarma_aor](aor-template)
contact=sip:sip.zadarma.com:5060

[zadarma_endpoint](endpoint-template)
outbound_auth=zadarma_auth
aors=zadarma_aor
from_user=${ENV(ZADARMA_SIP_ID)}
from_domain=sip.zadarma.com
callerid=${ENV(ZADARMA_DID_CL)} <${ENV(ZADARMA_DID_CL)}>

[zadarma_identify]
type=identify
endpoint=zadarma_endpoint
match=sip.zadarma.com
match=185.45.152.0/24
match=185.45.155.0/24

; ==============================================================================
; 2. TRONCAL SIP: REDVOISS CHILE (Carrier Local Santiago / Fija y Móvil CL)
; ==============================================================================
[redvoiss_reg]
type=registration
outbound_auth=redvoiss_auth
server_uri=sip:sip.redvoiss.net:5060
client_uri=sip:${ENV(REDVOISS_USER)}@sip.redvoiss.net:5060
retry_interval=30
expiration=3600
transport=transport-udp

[redvoiss_auth](auth-template)
username=${ENV(REDVOISS_USER)}
password=${ENV(REDVOISS_PASSWORD)}

[redvoiss_aor](aor-template)
contact=sip:sip.redvoiss.net:5060

[redvoiss_endpoint](endpoint-template)
outbound_auth=redvoiss_auth
aors=redvoiss_aor
from_user=${ENV(REDVOISS_USER)}
from_domain=sip.redvoiss.net
callerid=${ENV(REDVOISS_DID_CL)} <${ENV(REDVOISS_DID_CL)}>

[redvoiss_identify]
type=identify
endpoint=redvoiss_endpoint
match=sip.redvoiss.net
match=200.29.0.0/19
match=201.238.224.0/20

; ==============================================================================
; 3. TRONCAL SIP: TWILIO CHILE (Elastic SIP Trunking / E.164 +56)
; ==============================================================================
[twilio_reg]
type=registration
outbound_auth=twilio_auth
server_uri=sip:${ENV(TWILIO_SIP_DOMAIN)}.pstn.twilio.com:5060
client_uri=sip:${ENV(TWILIO_CREDENTIAL_USER)}@${ENV(TWILIO_SIP_DOMAIN)}.pstn.twilio.com:5060
retry_interval=20
expiration=600
transport=transport-udp

[twilio_auth](auth-template)
username=${ENV(TWILIO_CREDENTIAL_USER)}
password=${ENV(TWILIO_CREDENTIAL_PASS)}

[twilio_aor](aor-template)
contact=sip:${ENV(TWILIO_SIP_DOMAIN)}.pstn.twilio.com:5060

[twilio_endpoint](endpoint-template)
outbound_auth=twilio_auth
aors=twilio_aor
from_domain=${ENV(TWILIO_SIP_DOMAIN)}.pstn.twilio.com
callerid=${ENV(TWILIO_DID_CL)} <${ENV(TWILIO_DID_CL)}>

[twilio_identify]
type=identify
endpoint=twilio_endpoint
match=${ENV(TWILIO_SIP_DOMAIN)}.pstn.twilio.com
match=54.171.127.192/26
match=54.65.63.192/26
match=54.169.127.128/26
match=177.71.206.192/26

; ==============================================================================
; 4. TRONCAL SIP: NET2PHONE CHILE (PBX Cloud / SIP Trunking Chile)
; ==============================================================================
[net2phone_reg]
type=registration
outbound_auth=net2phone_auth
server_uri=sip:sip.net2phone.cl:5060
client_uri=sip:${ENV(NET2PHONE_USER)}@sip.net2phone.cl:5060
retry_interval=30
expiration=1800
transport=transport-udp

[net2phone_auth](auth-template)
username=${ENV(NET2PHONE_USER)}
password=${ENV(NET2PHONE_PASS)}

[net2phone_aor](aor-template)
contact=sip:sip.net2phone.cl:5060

[net2phone_endpoint](endpoint-template)
outbound_auth=net2phone_auth
aors=net2phone_aor
from_user=${ENV(NET2PHONE_USER)}
from_domain=sip.net2phone.cl
callerid=${ENV(NET2PHONE_DID_CL)} <${ENV(NET2PHONE_DID_CL)}>

[net2phone_identify]
type=identify
endpoint=net2phone_endpoint
match=sip.net2phone.cl
match=64.136.174.0/24
match=66.241.96.0/24

; ==============================================================================
; ENDPOINTS LOCALES / WEBRTC / SOFTPHONES DE OPERADOR / INGENIERÍA
; ==============================================================================
[1001]
type=endpoint
context=internal-viernes
allow=!all,opus,alaw,ulaw
auth=auth1001
aors=1001
direct_media=no
language=es_CL

[auth1001](auth-template)
username=1001
password=${ENV(SIP_INTERNAL_PASS_1001)}

[1001](aor-template)
max_contacts=3

; WebRTC Operator Endpoint (WSS / Datachannels)
[webrtc_operator]
type=endpoint
context=internal-viernes
allow=!all,opus,alaw,ulaw
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
auth=auth_webrtc
aors=aor_webrtc

[auth_webrtc](auth-template)
username=webrtc_operator
password=${ENV(SIP_WEBRTC_PASS)}

[aor_webrtc](aor-template)
max_contacts=5
