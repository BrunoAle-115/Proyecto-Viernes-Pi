<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00a8ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#ffb700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular HUD plate -->
  <circle cx="32" cy="32" r="30" fill="#040812" stroke="#00f0ff" stroke-width="1.5" opacity="0.95"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffb700" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Segmented Outer Ring (Stark Arc Reactor Ticks) -->
  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <line x1="32" y1="5" x2="32" y2="10"/>
    <line x1="32" y1="54" x2="32" y2="59"/>
    <line x1="5" y1="32" x2="10" y2="32"/>
    <line x1="54" y1="32" x2="59" y2="32"/>
    <line x1="13" y1="13" x2="17" y2="17"/>
    <line x1="47" y1="47" x2="51" y2="51"/>
    <line x1="51" y1="13" x2="47" y2="17"/>
    <line x1="13" y1="51" x2="17" y2="47"/>
  </g>

  <!-- Energy Glow Core -->
  <circle cx="32" cy="32" r="16" fill="url(#arcGlow)"/>

  <!-- Central Arc Core Triangle / Ring -->
  <polygon points="32,18 44,39 20,39" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <polygon points="32,22 40,36 24,36" fill="#00f0ff" fill-opacity="0.3" stroke="#ffb700" stroke-width="1"/>
  <circle cx="32" cy="33" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
